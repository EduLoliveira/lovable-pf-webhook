<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Formulário PF (Lovable)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.4rem; }
    .group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
    input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; color: #fff; font-size: 0.95rem; }
    input:focus, textarea:focus { border-color: #38bdf8; outline: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    #status { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 0.9rem; display: none; }
    .success { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .error { background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; }
  </style>
</head>
<body>

<div class="card">
  <h2>📋 Cadastro de Pessoa Física (PF)</h2>
  <p style="font-size:0.85rem; color:#94a3b8;">Simulação de componente gerado via Lovable que envia dados em tempo real para o Terminal Webhook.</p>

  <form id="formCadastro">
    <div class="group">
      <label>Nome Completo</label>
      <input type="text" id="nome" required value="Carlos Alberto Souza">
    </div>

    <div class="grid">
      <div class="group">
        <label>CPF</label>
        <input type="text" id="cpf" required value="214.589.630-10">
      </div>
      <div class="group">
        <label>Data de Nascimento</label>
        <input type="date" id="dataNascimento" value="1988-11-20">
      </div>
    </div>

    <div class="grid">
      <div class="group">
        <label>E-mail</label>
        <input type="email" id="email" required value="carlos.souza@email.com">
      </div>
      <div class="group">
        <label>Telefone / WhatsApp</label>
        <input type="tel" id="telefone" value="(11) 99882-1122">
      </div>
    </div>

    <div class="grid">
      <div class="group">
        <label>CEP</label>
        <input type="text" id="cep" value="01311-000">
      </div>
      <div class="group">
        <label>Logradouro / Número</label>
        <input type="text" id="logradouro" value="Avenida Brigadeiro Faria Lima, 3477">
      </div>
    </div>

    <div class="grid">
      <div class="group">
        <label>Cidade</label>
        <input type="text" id="cidade" value="São Paulo">
      </div>
      <div class="group">
        <label>UF</label>
        <input type="text" id="uf" maxlength="2" value="SP">
      </div>
    </div>

    <div class="group">
      <label>Observações</label>
      <textarea id="observacoes" rows="2">Cliente cadastrado para teste de comunicação direta com o Terminal.</textarea>
    </div>

    <button type="submit" id="btnSubmit">Enviar para o Terminal Local</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const form = document.getElementById('formCadastro');
  const statusDiv = document.getElementById('status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusDiv.style.display = 'none';

    const payload = {
      nome: document.getElementById('nome').value,
      cpf: document.getElementById('cpf').value,
      dataNascimento: document.getElementById('dataNascimento').value,
      email: document.getElementById('email').value,
      telefone: document.getElementById('telefone').value,
      cep: document.getElementById('cep').value,
      logradouro: document.getElementById('logradouro').value,
      cidade: document.getElementById('cidade').value,
      uf: document.getElementById('uf').value,
      observacoes: document.getElementById('observacoes').value
    };

    try {
      const response = await fetch('http://localhost:5000/api/cadastro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) throw new Error('Status: ' + response.status);
      const resData = await response.json();

      statusDiv.className = 'success';
      statusDiv.innerHTML = `✅ <b>Sucesso!</b> Protocolo #${resData.protocolo} recebido pelo Terminal às ${resData.recebidoEm}.`;
      statusDiv.style.display = 'block';
    } catch (err) {
      statusDiv.className = 'error';
      statusDiv.innerHTML = `❌ <b>Erro de conexão:</b> Certifique-se de que o script <code>iniciar_terminal.ps1</code> está em execução na porta 5000.<br><small>${err.message}</small>`;
      statusDiv.style.display = 'block';
    }
  });
</script>

</body>
</html>
